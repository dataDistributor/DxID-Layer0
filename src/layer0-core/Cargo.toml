[package]
name = "layer0-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
warp = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zk-verification = { path = "../zk-verification" }
once_cell = "1.20.3"
rand = "0.8.0"
